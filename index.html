<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Truyền thông chính sách đối với dân tộc Sán Chỉ - Quảng Ninh</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; scroll-behavior: smooth; font-family: 'Segoe UI', Arial, sans-serif; background: #0b0c10; }
        
        /* 1. Trang Intro - Khớp ảnh 1 */
        .page-intro {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('trangdau.jpg') no-repeat center center;
            background-size: cover; color: white; text-align: center; position: relative;
        }
        .content-box { 
            max-width: 900px; padding: 50px 40px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 20px; backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            margin: 0 20px; 
        }
        .page-intro h1 { 
            font-size: 3rem; color: #f1c40f; margin-bottom: 20px; 
            text-transform: uppercase; letter-spacing: 2px; font-weight: 800;
        }
        .page-intro p { font-size: 1.2rem; color: #fff; margin-bottom: 10px; }
        .scroll-down { 
            position: absolute; bottom: 50px; color: #f1c40f; 
            text-decoration: none; font-weight: bold; 
            font-size: 1.1rem; letter-spacing: 1px; transition: 0.3s; 
        }

        /* 2. Bản đồ & Nút Quay lại - Khớp ảnh 2 */
        .page-map { height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; }
        .btn-back { 
            position: absolute; top: 20px; left: 20px; z-index: 1000; 
            padding: 8px 15px; background: rgba(0,0,0,0.7); color: #f1c40f; 
            border: 2px solid #f1c40f; text-decoration: none; border-radius: 6px; 
            font-weight: bold; font-size: 0.9rem; text-transform: uppercase;
        }

        /* 3. Chú thích (Legend) - Khớp ảnh 3 & 4 (Hết lệch) */
        .legend { 
            background: #fff; padding: 15px 20px; border-radius: 12px; 
            color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-width: 250px;
        }
        .legend b { 
            font-size: 1.2rem; display: block; padding-bottom: 8px; 
            margin-bottom: 12px; border-bottom: 1px solid #ddd; 
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .legend-item { 
            display: flex; align-items: center; 
            margin-bottom: 12px; font-weight: 600; font-size: 1rem;
        }
        .legend-item:last-child { margin-bottom: 0; }
        .legend i { 
            width: 24px; height: 24px; border-radius: 50%; 
            margin-right: 15px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1);
        }

        /* 4. Overlay chi tiết */
        .discovery-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.98); z-index: 2000; display: none; color: white; overflow-y: auto; }
        .discovery-content { max-width: 900px; margin: 50px auto; padding: 20px; }
        .close-discovery { position: fixed; top: 20px; right: 30px; font-size: 45px; color: #f1c40f; cursor: pointer; }
        .discovery-img { width: 100%; border-radius: 12px; margin-bottom: 30px; border: 1px solid #45a29e; }
        .desc-box { background: rgba(31, 40, 51, 0.8); padding: 25px; border-radius: 10px; line-height: 1.9; font-size: 1.1rem; color: #ddd; text-align: justify; }
        .desc-box b { color: #f1c40f; }
    </style>
</head>
<body>

    <section class="page-intro" id="intro">
        <div class="content-box">
            <h1>HỆ SINH THÁI TRUYỀN THÔNG SÁN CHỈ</h1>
            <p>Hệ thống định vị 25 điểm nút truyền thông bảo tồn văn hóa tại Quảng Ninh.</p>
            <br>
            <a href="#map-section" class="scroll-down">▼ KHÁM PHÁ BẢN ĐỒ</a>
        </div>
    </section>

    <section id="map-section" class="page-map">
        <a href="#intro" class="btn-back">⬅ QUAY LẠI</a>
        <div id="map"></div>
    </section>

    <div id="discoveryOverlay" class="discovery-overlay">
        <span class="close-discovery" onclick="closeDiscovery()">&times;</span>
        <div class="discovery-content" id="discoveryBody"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <script>
        var map = L.map('map', { minZoom: 8 }).setView([21.3, 107.3], 9);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png').addTo(map);

        var clusters = L.markerClusterGroup();

        // GIỮ NGUYÊN 100% DỮ LIỆU ÔNG GIÁO ĐÃ SỬA
        var mediaData = [
            { id: 1, name: "UBND Tỉnh Quảng Ninh", coords: [20.9416, 107.1237], cat: "direct", img: "1.jpg", duty: "Chủ thể ban hành văn bản quy phạm pháp luật và phê duyệt quy hoạch chiến lược truyền thông chính sách." },
            { id: 2, name: "Sở Văn hóa, Thể thao và Du lịch", coords: [20.9441, 107.1226], cat: "direct", img: "2.jpg", duty: "Cơ quan tham mưu quản lý nhà nước về di sản, thực thi chính sách bảo tồn văn hóa các dân tộc thiểu số." },
            { id: 3, name: "Ban Tuyên giáo Thành ủy Hạ Long", coords: [20.9503, 107.0762], cat: "direct", img: "3.jpg", duty: "Cơ quan định hướng tư tưởng, kiểm soát nội dung và điều tiết dư luận xã hội trên địa bàn tỉnh." },
            { id: 4, name: "Trung tâm Truyền thông Quảng Ninh", coords: [20.9550, 107.1003], cat: "mass", img: "4.jpg", duty: "Cơ quan báo chí hội tụ đa phương tiện, sản xuất nội dung tiếng dân tộc phục vụ nhiệm vụ chính trị." },
            { id: 5, name: "Văn phòng Tỉnh ủy Quảng Ninh", coords: [20.9415, 107.1221], cat: "direct", img: "5.jpg", duty: "Tổng hợp thông tin, tham mưu cho Lãnh đạo tỉnh về các Nghị quyết phát triển vùng đồng bào dân tộc." },
            { id: 6, name: "Thác Khe Vằn (Hát Sóong Cọ)", coords: [21.4859, 107.4783], cat: "indirect", img: "6.jpg", duty: "Thiết chế văn hóa tự nhiên, không gian thực hành di sản văn hóa phi vật thể của cộng đồng Sán Chỉ." },
            { id: 7, name: "Nhà văn hóa huyện Bình Liêu", coords: [21.5257, 107.4001], cat: "direct", img: "7.jpg", duty: "Thiết chế văn hóa cơ sở trọng điểm, nơi tổ chức hội nghị và đối thoại trực tiếp giữa chính quyền và người dân." },
            { id: 8, name: "Đình Lục Nà", coords: [21.5496, 107.4293], cat: "indirect", img: "8.jpg", duty: "Địa chỉ giáo dục truyền thống, kết hợp truyền thông chính sách qua các nghi lễ tín ngưỡng dân gian." },
            { id: 9, name: "Bảo tàng Quảng Ninh", coords: [20.9487, 107.0975], cat: "mass", img: "9.jpg", duty: "Kênh truyền thông trực quan, lưu trữ và quảng bá diện mạo văn hóa Sán Chỉ tới công chúng quốc tế." },
            { id: 10, name: "UBND xã Tiên Yên", coords: [21.3314, 107.4047], cat: "direct", img: "10.jpg", duty: "Cấp chính quyền thực thi, cụ thể hóa các chương trình mục tiêu quốc gia thành kế hoạch hành động tại địa phương." },
            { id: 11, name: "Cầu treo Nà Làng", coords: [21.5327, 107.3974], cat: "indirect", img: "11.jpg", duty: "Kênh truyền thông vật thể, minh chứng cho chính sách đầu tư hạ tầng phục vụ dân sinh vùng đồng bào dân tộc." },
            { id: 12, name: "Nhà Văn hóa thôn Xóm Nương", coords: [21.3316, 107.4048], cat: "direct", img: "12.jpg", duty: "Điểm tiếp xúc chính sách cuối cùng, nơi thực hiện công tác dân vận khéo và thu thập phản hồi từ cộng đồng." },
            { id: 13, name: "TT Văn hóa Thể thao vùng Đông Bắc", coords: [21.3333, 107.4066], cat: "direct", img: "13.jpg", duty: "Trung tâm điều phối các sự kiện văn hóa quy mô liên vùng, thúc đẩy giao lưu và đại đoàn kết dân tộc." },
            { id: 14, name: "Phố đi bộ Tiên Yên", coords: [21.3311, 107.4023], cat: "indirect", img: "14.jpg", duty: "Môi trường truyền thông mở, lồng ghép chính sách phát triển kinh tế ban đêm với bảo tồn bản sắc địa phương." },
            { id: 15, name: "Thác Lang Cang", coords: [21.2502, 107.2396], cat: "indirect", img: "15.jpg", duty: "Kênh truyền thông sinh thái, gắn kết mục tiêu bảo vệ môi trường với phát triển du lịch cộng đồng bền vững." },
            { id: 16, name: "TT Văn hóa Điện ảnh Quảng Ninh", coords: [20.9508, 107.0790], cat: "mass", img: "16.jpg", duty: "Sử dụng ngôn ngữ nghệ thuật và điện ảnh để tuyên truyền cổ động các giá trị chính sách văn hóa." },
            { id: 17, name: "UBND xã Đông Ngũ", coords: [21.3361, 107.4842], cat: "direct", img: "17.jpg", duty: "Tổ chức thực hiện quy chế dân chủ cơ sở và phổ biến giáo dục pháp luật cho cộng đồng dân tộc thiểu số." },
            { id: 18, name: "Nhà văn hóa xã Đông Ngũ", coords: [21.3353, 107.4853], cat: "direct", img: "18.jpg", duty: "Nơi duy trì các câu lạc bộ văn nghệ truyền thống - một kênh truyền thông chính sách tự nguyện hiệu quả." },
            { id: 19, name: "Cột mốc 1305", coords: [21.6490, 107.4412], cat: "indirect", img: "19.jpg", duty: "Kênh truyền thông về chủ quyền và an ninh quốc phòng, khơi dậy lòng yêu nước và ý thức bảo vệ biên giới." },
            { id: 20, name: "Cầu treo Pắc Phe", coords: [21.5650, 107.4320], cat: "indirect", img: "20.jpg", duty: "Công trình biểu tượng của chính sách thu hẹp khoảng cách vùng miền và phát triển liên kết vùng." },
            { id: 21, name: "Lễ hội cầu mùa Húc Động", coords: [21.4807, 107.4459], cat: "indirect", img: "21.jpg", duty: "Hình thức truyền thông qua lễ nghi cộng đồng, củng cố hệ giá trị truyền thống theo định hướng của Đảng." },
            { id: 22, name: "Mùa vàng Lục Hồn", coords: [21.5464, 107.4339], cat: "mass", img: "22.jpg", duty: "Kênh truyền thông hình ảnh về tiềm năng nông nghiệp và thế mạnh du lịch vùng cao Bình Liêu." },
            { id: 23, name: "SVĐ Húc Động (Bóng đá nữ)", coords: [21.4804, 107.4465], cat: "indirect", img: "23.jpg", duty: "Kênh truyền thông đặc thù thông qua hoạt động thể chất, tôn vinh vai trò của phụ nữ dân tộc Sán Chỉ." },
            { id: 24, name: "Miến dong Húc Động", coords: [21.4802, 107.4469], cat: "indirect", img: "24.jpg", duty: "Truyền thông về chính sách OCOP, nâng cao năng lực kinh tế và thực hiện chiến lược xóa đói giảm nghèo." },
            { id: 25, name: "Miến dong Bình Liêu", coords: [21.5773, 107.4553], cat: "indirect", img: "25.jpg", duty: "Xây dựng thương hiệu nông sản địa phương gắn liền với uy tín và chính sách hỗ trợ phát triển vùng đặc biệt khó khăn." }
        ];

        mediaData.forEach(function(item) {
            var color = item.cat === 'direct' ? "#e74c3c" : item.cat === 'mass' ? "#3498db" : "#2ecc71";
            var m = L.circleMarker(item.coords, { radius: 10, fillColor: color, color: "#fff", weight: 2, fillOpacity: 0.95 });
            m.bindPopup(`<div style="text-align:center;"><b>${item.name}</b><br><button onclick="openDiscovery(${item.id})" style="margin-top:10px; cursor:pointer; background:#1f2833; color:#f1c40f; border:1px solid #f1c40f; padding:5px 10px; border-radius:3px; font-weight:bold;">CHI TIẾT</button></div>`);
            clusters.addLayer(m);
        });
        map.addLayer(clusters);

        function openDiscovery(id) {
            var data = mediaData.find(x => x.id === id);
            var detailContent = "";
            var tagLabel = "";
            var tagColor = "";

            if (data.cat === "direct") {
                tagLabel = "Kênh Trực tiếp (Hành chính)";
                tagColor = "#e74c3c";
                detailContent = `Điểm nút này đóng vai trò là trụ cột hành chính. Chính sách được chuyển hóa thành các kế hoạch cụ thể, tiếp cận người dân qua hội họp và tiếp xúc cử tri.`;
            } else if (data.cat === "mass") {
                tagLabel = "Kênh Đại chúng (Báo chí)";
                tagColor = "#3498db";
                detailContent = `Vận hành theo cơ chế phát tán thông tin diện rộng, sử dụng báo chí và công nghệ số để hình ảnh hóa chính sách, tạo sự đồng thuận xã hội.`;
            } else {
                tagLabel = "Kênh Gián tiếp (Văn hóa)";
                tagColor = "#2ecc71";
                detailContent = `Chính sách được lồng ghép khéo léo vào lễ hội, danh thắng. Giúp người dân tiếp nhận thông qua lòng tự hào dân tộc và lợi ích kinh tế.`;
            }

            document.getElementById('discoveryBody').innerHTML = `
                <img src="${data.img}" class="discovery-img" onerror="this.src='https://via.placeholder.com/800x450?text=IMAGE+${data.name}'">
                <div class="discovery-text">
                    <span style="background:${tagColor}; padding:5px 12px; border-radius:3px; font-weight:bold;">${tagLabel}</span>
                    <h2 style="margin-top:15px; color:#f1c40f;">${data.name}</h2>
                    <h4 style="color:#45a29e; border-bottom:1px solid #45a29e; padding-bottom:10px;">Chức năng: ${data.duty}</h4>
                    <div class="desc-box"><b>Phân tích vận hành:</b><br>${detailContent}</div>
                </div>
                <button onclick="closeDiscovery()" style="display:block; margin:40px auto; padding:12px 35px; background:#f1c40f; border:none; color:#000; font-weight:bold; cursor:pointer; border-radius:5px;">QUAY LẠI BẢN ĐỒ</button>
            `;
            document.getElementById('discoveryOverlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeDiscovery() {
            document.getElementById('discoveryOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // TẠO CHÚ THÍCH (LEGEND) CHUẨN KHÔNG LỆCH
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<b>PHÂN LOẠI HỆ THỐNG</b>' +
                '<div class="legend-item"><i style="background:#e74c3c"></i> Kênh Trực tiếp (Hành chính)</div>' +
                '<div class="legend-item"><i style="background:#3498db"></i> Kênh Đại chúng (Báo chí)</div>' +
                '<div class="legend-item"><i style="background:#2ecc71"></i> Kênh Gián tiếp (Văn hóa)</div>';
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
