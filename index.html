<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Hệ sinh thái Truyền thông Sán Chỉ - Quảng Ninh</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; scroll-behavior: smooth; font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden; }
        .page-intro {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                        url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&q=80&w=2070');
            background-size: cover; color: white; text-align: center; position: relative;
        }
        .content-box { max-width: 900px; padding: 50px; background: rgba(255,255,255,0.08); border-radius: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); margin: 0 20px; }
        .page-intro h1 { font-size: 2.8rem; color: #f1c40f; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .scroll-down { position: absolute; bottom: 40px; color: #f1c40f; text-decoration: none; font-weight: bold; font-size: 1.2rem; animation: bounce 2s infinite; cursor: pointer; }
        .page-map { height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; background: #000; }
        .btn-back { position: absolute; top: 20px; left: 60px; z-index: 1000; padding: 12px 20px; background: #000; color: #f1c40f; border: 2px solid #f1c40f; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .discovery-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 2000; display: none;
            color: white; overflow-y: auto; padding: 60px 20px;
        }
        .discovery-content { max-width: 1000px; margin: 0 auto; }
        .close-discovery { position: fixed; top: 25px; right: 35px; font-size: 50px; color: #f1c40f; cursor: pointer; }
        .discovery-img { width: 100%; max-height: 450px; object-fit: cover; border-radius: 20px; margin-bottom: 35px; border: 3px solid #f1c40f; }
        .discovery-text h2 { color: #f1c40f; font-size: 2.5rem; margin-bottom: 20px; }
        .discovery-text p { font-size: 1.3rem; line-height: 2; color: #ccc; }
        .btn-explore { display: block; width: 100%; padding: 10px; background: #f1c40f; color: #000; text-align: center; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 12px; border: none; cursor: pointer; }
        .legend { background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 10px; line-height: 24px; color: #333; font-size: 13px; }
        .legend i { width: 12px; height: 12px; display: inline-block; margin-right: 10px; border-radius: 50%; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
    </style>
</head>
<body>

    <section class="page-intro" id="intro">
        <div class="content-box">
            <h1>Hệ sinh thái Truyền thông Sán Chỉ</h1>
            <p>Mô hình định vị kênh truyền thông chính sách bảo tồn văn hóa tại Quảng Ninh.</p>
        </div>
        <a href="#map-section" class="scroll-down">▼ KHÁM PHÁ MÔ HÌNH BẢN ĐỒ</a>
    </section>

    <section id="map-section" class="page-map">
        <a href="#intro" class="btn-back">⬅ QUAY LẠI GIỚI THIỆU</a>
        <div id="map"></div>
    </section>

    <div id="discoveryOverlay" class="discovery-overlay">
        <span class="close-discovery" onclick="closeDiscovery()">&times;</span>
        <div class="discovery-content" id="discoveryBody"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // SIẾT CHẶT TỌA ĐỘ: Chỉ lấy vùng Quảng Ninh sát nhất
        var tightQNBounds = [
            [20.7, 106.3], // Góc dưới bên trái
            [21.7, 108.1]  // Góc trên bên phải
        ];

        var map = L.map('map', {
            center: [21.2, 107.3], 
            zoom: 10,
            minZoom: 10,           // KHÓA: Không cho zoom xa hơn mức này
            maxZoom: 14,           // KHÓA: Không cho zoom quá sâu
            maxBounds: tightQNBounds, 
            maxBoundsViscosity: 1.0 // KHÓA: Kéo ra là tự bật lại vào trong ngay
        });

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { opacity: 0.9 }).addTo(map);

        var mediaData = [
            { id: "p1", name: "Đảng uỷ xã Húc Động", coords: [21.511, 107.576], cat: "policy", short: "Kênh chỉ đạo chính sách gốc.", full: "Đảng ủy xã Húc Động là hạt nhân điều hành chính sách bảo tồn tại cơ sở..." },
            { id: "p2", name: "Tòa soạn hội tụ Tiên Yên", coords: [21.325, 107.412], cat: "media", short: "Số hóa nội dung truyền thông.", full: "Nơi chuyển tải các giá trị văn hóa thành sản phẩm truyền thông đa phương tiện..." },
            { id: "p3", name: "Xưởng miến dong Húc Động", coords: [21.516, 107.584], cat: "production", short: "Kênh truyền thông qua sản phẩm OCOP.", full: "Quảng bá văn hóa thông qua giá trị kinh tế của đặc sản địa phương..." },
            { id: "p4", name: "Lễ hội Mùa vàng Bình Liêu", coords: [21.560, 107.510], cat: "event", short: "Truyền thông văn hóa trải nghiệm.", full: "Không gian thực hành di sản trực tiếp giữa cộng đồng và du khách..." }
        ];

        mediaData.forEach(function(item) {
            var color = item.cat === 'policy' ? "#ff0000" : item.cat === 'media' ? "#0074D9" : item.cat === 'production' ? "#2ecc71" : "#f1c40f";
            var marker = L.circleMarker(item.coords, { radius: 14, fillColor: color, color: "#fff", weight: 2, fillOpacity: 1 }).addTo(map);
            marker.bindPopup(`<b>${item.name}</b><br>${item.short}<button class="btn-explore" onclick="openDiscovery('${item.id}')">KHÁM PHÁ CHI TIẾT</button>`);
        });

        function openDiscovery(id) {
            var data = mediaData.find(x => x.id === id);
            document.getElementById('discoveryBody').innerHTML = `
                <img src="https://images.unsplash.com/photo-1532375811408-1699045813f0?q=80&w=2070" class="discovery-img">
                <div class="discovery-text"><h2>${data.name}</h2><p>${data.full}</p></div>
                <button class="btn-explore" onclick="closeDiscovery()" style="width:200px; margin:40px auto;">QUAY LẠI BẢN ĐỒ</button>`;
            document.getElementById('discoveryOverlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeDiscovery() {
            document.getElementById('discoveryOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<b>PHÂN LOẠI KÊNH</b><br><i style="background:#ff0000"></i> Chính trị<br><i style="background:#0074D9"></i> Số hóa<br><i style="background:#2ecc71"></i> OCOP<br><i style="background:#f1c40f"></i> Lễ hội';
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
