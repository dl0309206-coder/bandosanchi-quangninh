<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Hệ sinh thái Truyền thông Sán Chỉ</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tải thư viện bản đồ từ nguồn bảo mật HTTPS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; scroll-behavior: smooth; font-family: sans-serif; background: #000; }
        
        /* Trang giới thiệu với ảnh nền .jpg */
        .page-intro {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('trangdau.jpg') no-repeat center center;
            background-size: cover; color: white; text-align: center;
        }
        
        .content-box { padding: 40px; background: rgba(0,0,0,0.6); border: 1px solid #f1c40f; border-radius: 15px; margin: 20px; }
        h1 { color: #f1c40f; text-transform: uppercase; margin-bottom: 10px; }
        
        .scroll-down { margin-top: 20px; color: #f1c40f; text-decoration: none; font-weight: bold; border: 2px solid #f1c40f; padding: 10px 20px; border-radius: 5px; }
        
        /* Khu vực bản đồ */
        .page-map { height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; }
        
        .btn-back { position: absolute; top: 20px; left: 20px; z-index: 1000; padding: 10px; background: #000; color: #f1c40f; border: 2px solid #f1c40f; text-decoration: none; font-weight: bold; border-radius: 5px; }
        
        /* Modal chi tiết ảnh */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; color: white; overflow-y: auto; text-align: center; }
        .overlay-content { max-width: 800px; margin: 50px auto; padding: 20px; }
        .close-btn { font-size: 40px; color: #f1c40f; cursor: pointer; position: absolute; top: 20px; right: 30px; }
        .pop-img { width: 100%; border-radius: 10px; border: 2px solid #f1c40f; }
        
        .btn-detail { background: #f1c40f; color: #000; border: none; padding: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- TRANG 1: GIỚI THIỆU -->
    <section class="page-intro">
        <div class="content-box">
            <h1>Hệ sinh thái Truyền thông Sán Chỉ</h1>
            <p>Định vị 25 điểm nút truyền thông chính sách tại Quảng Ninh</p>
            <br>
            <a href="#map-section" class="scroll-down">KHÁM PHÁ BẢN ĐỒ</a>
        </div>
    </section>

    <!-- TRANG 2: BẢN ĐỒ -->
    <section id="map-section" class="page-map">
        <a href="#" class="btn-back" onclick="window.location.reload()">⬅ QUAY LẠI</a>
        <div id="map"></div>
    </section>

    <!-- LỚP PHỦ XEM CHI TIẾT -->
    <div id="overlay" class="overlay">
        <span class="close-btn" onclick="closePopup()">&times;</span>
        <div class="overlay-content" id="overlayBody"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <script>
        // 1. Khởi tạo bản đồ
        var map = L.map('map').setView([21.3, 107.3], 9);

        // 2. Thêm lớp nền vệ tinh (Dùng HTTPS để tránh lỗi màn hình đen trên GitHub)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png').addTo(map);

        var clusters = L.markerClusterGroup();

        // 3. Danh sách 25 điểm dữ liệu (.jpg)
        var locations = [
            { id: 1, name: "UBND Tỉnh Quảng Ninh", coords: [20.9416, 107.1237], img: "1.jpg" },
            { id: 2, name: "Sở Văn hóa & Thể thao", coords: [20.9441, 107.1226], img: "2.jpg" },
            { id: 3, name: "Ban Tuyên Giáo Hạ Long", coords: [20.9503, 107.0762], img: "3.jpg" },
            { id: 4, name: "TT Truyền Thông QN", coords: [20.9550, 107.1003], img: "4.jpg" },
            { id: 5, name: "Văn Phòng Tỉnh Uỷ", coords: [20.9415, 107.1221], img: "5.jpg" },
            { id: 6, name: "Thác Khe Vằn", coords: [21.4859, 107.4783], img: "6.jpg" },
            { id: 7, name: "NVH Bình Liêu", coords: [21.5257, 107.4001], img: "7.jpg" },
            { id: 8, name: "Đình Lục Nà", coords: [21.5496, 107.4293], img: "8.jpg" },
            { id: 9, name: "Bảo tàng Quảng Ninh", coords: [20.9487, 107.0975], img: "9.jpg" },
            { id: 10, name: "UBND Tiên Yên", coords: [21.3314, 107.4047], img: "10.jpg" },
            { id: 11, name: "Cầu treo Nà Làng", coords: [21.5327, 107.3974], img: "11.jpg" },
            { id: 12, name: "NVH Xóm Nương", coords: [21.3316, 107.4048], img: "12.jpg" },
            { id: 13, name: "TT Văn Hóa Đông Bắc", coords: [21.3333, 107.4066], img: "13.jpg" },
            { id: 14, name: "Phố đi bộ Tiên Yên", coords: [21.3311, 107.4023], img: "14.jpg" },
            { id: 15, name: "Thác Lang Cang", coords: [21.2502, 107.2396], img: "15.jpg" },
            { id: 16, name: "TT Điện Ảnh QN", coords: [20.9508, 107.0790], img: "16.jpg" },
            { id: 17, name: "UBND Đông Ngũ", coords: [21.3361, 107.4842], img: "17.jpg" },
            { id: 18, name: "NVH Đông Ngũ", coords: [21.3353, 107.4853], img: "18.jpg" },
            { id: 19, name: "Cột mốc 1305", coords: [21.6490, 107.4412], img: "19.jpg" },
            { id: 20, name: "Cầu treo Pắc Phe", coords: [21.5650, 107.4320], img: "20.jpg" },
            { id: 21, name: "Lễ hội cầu mùa", coords: [21.4807, 107.4459], img: "21.jpg" },
            { id: 22, name: "Mùa vàng Lục Hồn", coords: [21.5464, 107.4339], img: "22.jpg" },
            { id: 23, name: "SVĐ Húc Động", coords: [21.4804, 107.4465], img: "23.jpg" },
            { id: 24, name: "Miến dong Húc Động", coords: [21.4802, 107.4469], img: "24.jpg" },
            { id: 25, name: "Miến dong Bình Liêu", coords: [21.5773, 107.4553], img: "25.jpg" }
        ];

        // 4. Đưa các điểm lên bản đồ
        locations.forEach(function(loc) {
            var marker = L.marker(loc.coords);
            marker.bindPopup("<b>" + loc.name + "</b><br><button class='btn-detail' onclick='openPopup(" + loc.id + ")'>XEM ẢNH</button>");
            clusters.addLayer(marker);
        });
        map.addLayer(clusters);

        // 5. Hàm điều khiển Popup xem ảnh
        function openPopup(id) {
            var data = locations.find(x => x.id === id);
            document.getElementById('overlayBody').innerHTML = 
                "<h2>" + data.name + "</h2>" +
                "<img src='" + data.img + "' class='pop-img' onerror=\"this.src='https://via.placeholder.com/600x400?text=Thieu+anh+" + data.img + "'\">";
            document.getElementById('overlay').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
